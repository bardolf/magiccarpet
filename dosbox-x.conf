# Sdilene nastaveni pro Magic Carpet Plus + Magic Carpet 2
# Varianta pro dosbox-x (klasicke klice DOSBox 0.74, jine nez dosbox-staging).
# Autoexec zde zamerne NENI - prikazy dodava play.sh pres -c.

[sdl]
fullscreen     = true
fullresolution = desktop
output         = opengl
autolock       = true

[dosbox]
machine = svga_s3
memsize = 16

[render]
aspect = true
scaler = none

[cpu]
# dynamic core = nutnost pro narocne SVGA 3D hry jako Magic Carpet 2
core    = dynamic
cputype = auto
cycles  = max
# krok pro Ctrl+F11 / Ctrl+F12 (hodnoty pod 100 = procenta)
cycleup   = 20
cycledown = 20

[mixer]
rate = 44100

[sblaster]
sbtype  = sb16
sbbase  = 220
irq     = 5
dma     = 1
hdma    = 5
oplmode = auto

[speaker]
pcspeaker = true

[dos]
xms = true
ems = true
umb = true
