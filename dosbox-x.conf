# Sdilene nastaveni pro Magic Carpet Plus + Magic Carpet 2
# Varianta pro dosbox-x (klasicke klice DOSBox 0.74, jine nez dosbox-staging).
# Autoexec zde zamerne NENI - prikazy dodava play.sh pres -c.

[sdl]
fullscreen     = true
fullresolution = desktop
output         = opengl
autolock       = true

[dosbox]
machine = svga_s3
memsize = 16

[render]
aspect = true
scaler = none

[cpu]
# dynamic core = nutnost pro narocne SVGA 3D hry jako Magic Carpet 2
core    = dynamic
cputype = auto
cycles  = max
# krok pro Ctrl+F11 / Ctrl+F12 (hodnoty pod 100 = procenta)
cycleup   = 20
cycledown = 20

[mixer]
# Shodne s hostitelem (PipeWire jede 48 kHz s kvantem 1024), viz komentar
# ve stejne sekci v dosbox-staging.conf.
rate      = 48000
blocksize = 1024
prebuffer = 50

[voodoo]
# Obe hry jsou starsi nez 3dfx a Glide nepouzivaji - stejne jako v
# dosbox-staging.conf. Hlaska "VOODOO LFB now at d0000000" v logu se
# vypisuje i tak, ale karta se neinicializuje.
voodoo_card = false

[sblaster]
sbtype  = sb16
sbbase  = 220
irq     = 5
dma     = 1
hdma    = 5
oplmode = auto

[speaker]
pcspeaker = true

[dos]
xms = true
ems = true
umb = true
