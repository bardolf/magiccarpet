# Sdilene nastaveni pro Magic Carpet Plus + Magic Carpet 2
# Pro dosbox-staging 0.82+. Prevzato z GOG dosboxMC.conf / dosboxMagicCarpet2.conf.
# Autoexec zde zamerne NENI - prikazy dodava play.sh pres -c.

[sdl]
fullscreen       = true
fullresolution   = desktop
windowresolution = default
output           = opengl

[dosbox]
machine = svga_s3
memsize = 16

[render]
glshader        = crt-auto
aspect          = auto
viewport        = fit

# 'auto' by pri CRT shaderu zaplo 'vertical' = vyska se zaokrouhli na cely
# nasobek (480*4=1920 z 2160), coz delalo cerne pruhy ze VSECH stran.
# 'off' necha obraz vyplnit celou vysku 4K obrazovky pri zachovani 4:3.
# Pruhy po stranach zustanou - 4:3 obraz na 16:9 panelu jinak nez deformaci
# roztahnout nejde (na to je ./play.sh --stretch).
integer_scaling = off

[cpu]
# 'dynamic' je podle dokumentace nutnost pro narocne SVGA 3D hry - a Magic
# Carpet 2 presne to je. 'auto' by dynamic pro protected mode zvolilo taky,
# ale radeji explicitne.
core    = dynamic
cputype = auto

# Obe hry jsou DOS4GW (protected mode), takze plati jen tato hodnota.
#
# POZOR: play.sh tuhle hodnotu vzdy prebiji pres -set, protoze kazda hra
# potrebuje jinou (MCP_CYCLES / MC2_CYCLES na zacatku play.sh):
#   Magic Carpet 1  100000 - vaze rychlost hry na CPU, pri 'max' je nehratelna
#   Magic Carpet 2  max    - na rychlosti CPU nezavisly
# Menit se tedy vyplati tam, ne tady. Tohle je jen fallback pri rucnim
# spusteni 'dosbox -conf ...'. Za behu lad Ctrl+F11 / Ctrl+F12.
cpu_cycles_protected = max

# Krok pro Ctrl+F11 / Ctrl+F12. Hodnoty pod 100 = procenta.
# Vychozi 10/20 je nesymetricke a prilis jemne na ladeni; 20/20 da
# znatelny a vratny krok (100000 -> 120000 -> 144000 ...).
cycleup   = 20
cycledown = 20

[mixer]
# Hostitel (PipeWire) jede na 48000 Hz s kvantem 1024 sample framu. GOG conf
# mel 44100 podle dobovych karet, ale kazda nesrovnalost proti hostiteli je
# jeden prevzorkovani navic - a s jadrem 'normal' (./play.sh --safe), kde je
# emulator na hranici vykonu, se to pozna jako praskani.
rate = 48000

# Vetsi bloky a delsi predbeh = vic vule proti planovani uloh na hostiteli.
# Plati se za to latenci zvuku, ktera u DOSove hry nikoho netrapi.
# Staging ma vychozich 512 / 20 ms; kvantum PipeWire je 1024.
blocksize = 1024
prebuffer = 50

[mouse]
# POZOR: zaporna hodnota tady obraci osu Y GLOBALNE, tedy i kurzor v menu,
# ve vyberu kouzel a na mape - proto se tu NEPOUZIVA.
# Invertace jen pro let se resi binarnim patchem hry, viz ./mouse-invert.py on
mouse_sensitivity = 100

# obchazi akceleraci mysi v OS; hry samotne maji vlastni silnou akceleraci,
# se kterou se z DOSBoxu nic delat neda
mouse_raw_input = true

[midi]
# dosbox-staging ma FluidSynth zabudovany - zadny MIDI demon na hostiteli
# neni potreba (to plati pro stary DOSBox 0.74).
#
# Tyka se prakticky jen Magic Carpet 1, ktera jede na FM synteze a po
# prepnuti na General midi (./play.sh setup) zacne hrat pres FluidSynth.
# Magic Carpet 2 ma hudbu na CD audio stopach a jeji MIDI driver SBPRO2.MDI
# posila zvuk na OPL cip, ne na MPU-401 - sem se tedy nic nedostane.
# Viz docs/zvuk-a-hudba.md
mididevice = fluidsynth

[fluidsynth]
# Z balicku fluid-soundfont-gm. Pro dobovy zvuk se hodi soundfont podle
# Roland SC-55, na kterem se hudba te doby skladala.
soundfont = /usr/share/soundfonts/FluidR3_GM.sf2

[voodoo]
# Staging emuluje 3dfx Voodoo defaultne ("VOODOO: Initialized with 4 MB of RAM,
# 16 threads" v logu). Obe hry jsou starsi nez Voodoo (1994/1995) a Glide
# nepouzivaji, takze je to jen zbytecna karta v emulovanem PCI a 4 MB navic.
voodoo = off

[sblaster]
sbtype  = sb16
sbbase  = 220
irq     = 5
dma     = 1
hdma    = 5
oplmode = auto

[speaker]
pcspeaker = discrete

[dos]
xms = true
ems = true
umb = true
